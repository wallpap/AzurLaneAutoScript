[project]
name = "azurlane-auto-script"
version = "0.0.0"
description = "Azur Lane automation with a graphical interface"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "numpy==1.19.5",
    "scipy==1.4.1",
    "pillow==8.3.2",
    "opencv-python==4.5.5.64",
    "imageio==2.27.0",
    "adbutils==0.11.0",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.0.1",
    "wrapt==1.15.0",
    "retrying==1.3.3",
    "lz4==3.1.3",
    "av==12.0.0",
    "psutil==5.9.3",
    "rich==11.2.0",
    "tqdm==4.62.3",
    "jellyfish==0.11.2",
    "pyyaml==5.4.1",
    "inflection==0.5.1",
    "pydantic==1.10.2",
    "aiofiles==0.7.0",
    "prettytable==2.2.1",
    "anyio==1.3.1",
    "onepush==1.4.0",
    "pycryptodome==3.9.9",
    "pypresence==4.2.1",
    "cnocr==1.2.2",
    "mxnet==1.6.0",
    "pywebio==1.6.2",
    "starlette==0.14.2",
    "uvicorn[standard]==0.17.6",
    "alas-webapp==0.3.7; sys_platform == 'win32'",
    "zerorpc==0.6.3",
    "pyzmq==22.3.0",
]

[dependency-groups]
dev = ["pytest==7.4.4", "tomli==2.0.1"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.dependency-metadata]]
name = "mxnet"
version = "1.6.0"
requires-dist = ["numpy>1.16.0,<2.0.0", "requests>=2.20.0,<3", "graphviz>=0.8.1,<0.9.0"]
